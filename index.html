<script>

// Si la conexión se cae, los jugadores reintentan solos; el anfitrión puede volver a ocupar la sala.
(function(){
if(window.claude&&window.claude.use)return;
function join(name,opts){return new Promise((res,rej)=>{
if(typeof Peer=="undefined")return rej({code:"upstream_error",message:"PeerJS no cargó"});
const hid="senda-"+name,H={},conns={},pres={},wantHub=!!(opts&&opts.host);let me=null,hub=false,conn=null,ready=false,pr={},src=[],list=[],ph=[],pk=null,done=false,left=false,retrying=false,tries=0;
const tm=setTimeout(()=>{if(!done){done=true;rej({code:"upstream_error",message:"Sin respuesta"})}},wantHub?32000:14000);
const fin=()=>{if(!done){done=true;clearTimeout(tm);res(R)}};
const fail=e=>{if(!done){done=true;clearTimeout(tm);rej(e)}};
const note=()=>setTimeout(()=>ph.forEach(f=>f({peers:list,joined:[],left:[],updated:[]})),0);
const mk=()=>{let s=src.slice();if(!s.some(x=>x[0]==me))s.push([me,pr]);list=s.map(([id,p])=>({peer:id,isMe:id==me,sameTab:id==me,kind:"viewer",guest:false,presence:id==me?pr:p,updatedAt:Date.now()}));note()};
const disp=m=>setTimeout(()=>(H[m.topic]||[]).forEach(f=>f({peer:m.from,isMe:m.from==me,sameTab:m.from==me,kind:"viewer",guest:false,topic:m.topic,data:m.data})),0);
const fan=m=>{Object.values(conns).forEach(c=>{try{c.send(m)}catch(e){}});disp(m)};
const push=()=>{src=Object.entries(pres);Object.values(conns).forEach(c=>{try{c.send({t:"l",l:src})}catch(e){}});mk()};
const clean=o=>{Object.keys(o).forEach(k=>o[k]===null&&delete o[k]);return o};
const retry=()=>{if(left||hub||retrying)return;retrying=true;setTimeout(()=>{retrying=false;link()},2500)};
const R={name,
emit(t,d){const m={t:"e",from:me,topic:t,data:d===undefined?null:JSON.parse(JSON.stringify(d))};if(hub)fan(m);else if(conn&&conn.open)conn.send(m);return Promise.resolve()},
on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=(H[t]||[]).filter(x=>x!==f)}},
presence(p){p=JSON.parse(JSON.stringify(p));clean(Object.assign(pr,p));if(hub){pres[me]=pr;push()}else{if(conn&&conn.open)conn.send({t:"p",patch:p});mk()}return Promise.resolve()},
peers(){return list},onPeers(f){ph.push(f);return()=>{ph=ph.filter(x=>x!==f)}},connected(){return ready},onConnection(){return()=>{}},
leave(){left=true;try{pk&&pk.destroy()}catch(e){}return Promise.resolve()}};
function link(){if(left||hub)return;
const go=()=>{conn=pk.connect(hid,{reliable:true});
conn.on("open",()=>{ready=true;try{conn.send({t:"p",patch:pr})}catch(e){}mk();fin()});
conn.on("data",d=>{if(!d)return;if(d.t=="e")disp(d);if(d.t=="l"){src=d.l;mk()}});
conn.on("close",()=>{ready=false;retry()});
conn.on("error",()=>{ready=false;retry()})};
if(pk&&!pk.destroyed&&!pk.disconnected&&me&&!hub){go();return}
try{pk&&pk.destroy()}catch(e){}
pk=new Peer();
pk.on("open",id=>{me=id;go()});
pk.on("error",e=>{if(!done&&!(e&&e.type=="peer-unavailable"))return fail(e);retry()})}
function startHub(){pk=new Peer(hid);
pk.on("open",id=>{me=id;hub=true;ready=true;pres[me]=pr;src=Object.entries(pres);mk();fin()});
pk.on("connection",c=>{c.on("open",()=>{conns[c.peer]=c;pres[c.peer]={};push()});
c.on("data",d=>{if(!d)return;if(d.t=="e")fan({t:"e",from:c.peer,topic:d.topic,data:d.data});if(d.t=="p"){pres[c.peer]=clean(Object.assign(pres[c.peer]||{},d.patch));push()}});
c.on("close",()=>{delete conns[c.peer];delete pres[c.peer];push()})});
pk.on("error",e=>{if(hub)return;if(e&&e.type=="unavailable-id"){if(wantHub&&tries++<10){try{pk.destroy()}catch(x){}setTimeout(startHub,2500)}else link()}else fail(e)})}
startHub();
})}
window.claude={use:async n=>n=="room"?{join,shim:true}:null};
})();
</script>

En el reino de Aletia todos creen conocer la verdad. Nadie recuerda quién la escribió.=In the kingdom of Aletia everyone believes they know the truth. No one remembers who wrote it.
Una noche, las campanas del gran teatro sonaron solas y las máscaras de la ciudad se agrietaron.=One night, the bells of the great theater rang by themselves and the masks of the city cracked.
Quien oyó el llamado baja a la Mazmorra de los Telones, donde Arlechino guarda lo que quiere ocultar.=Whoever heard the call descends into the Dungeon of Curtains, where Arlechino keeps what he wants hidden.
Cuarenta batallas lo separan de él. Tres de sus sirvientes vigilan el camino.=Forty battles lie between them and him. Three of his servants guard the way.
Arlechino me dio un nombre y un trono. No dejaré que lo manches.=Arlechino gave me a name and a throne. I won't let you stain it.
Basta... Solo obedecía. Arlechino dice que la verdad nos destruiría a todos.=Enough... I only obeyed. Arlechino says the truth would destroy us all.
Soy el segundo telón de Arlechino. Él me prometió que nadie volvería a mentirme.=I am Arlechino's second curtain. He promised me no one would ever lie to me again.
Perdóname... ya no sé quién escribió mi vida.=Forgive me... I no longer know who wrote my life.
Eres terco. Arlechino sonríe cuando alguien llega tan lejos. Aquí termina tu historia.=You are stubborn. Arlechino smiles when someone gets this far. Your story ends here.
Tenía miedo de la verdad. Déjame vivir y te contaré lo que sé.=I was afraid of the truth. Let me live and I'll tell you what I know.
baja la mirada y desaparece entre los telones.=lowers its gaze and vanishes behind the curtains.
se desvanece. El telón se cierra para siempre.=fades away. The curtain closes forever.
Qué hermoso final. Has llegado hasta mi escenario.=What a beautiful ending. You have reached my stage.
Yo protejo la verdad con mentiras. Sin ellas, el mundo se rompería.=I protect the truth with lies. Without them, the world would break.
Que empiece la función.=Let the show begin.
¿Creías que la verdad te haría libre? Entonces conoce a su dueño.=Did you think the truth would set you free? Then meet its owner.
La verdad arde. ¡Y yo soy su dueño!=The truth burns. And I am its owner!
Imposible... mis sirvientes viven. ¿Qué hiciste?=Impossible... my servants live. What have you done?
Qué función tan aburrida. Permítanme cambiar el guion.=What a boring show. Allow me to change the script.
¡Kian! Tú no deberías estar aquí.=Kian! You should not be here.
Los cuentos terminan cuando el cuentacuentos lo decide.=Stories end when the storyteller decides.
Kian chasquea los dedos y Arlechino se disuelve como tinta sobre el papel.=Kian snaps his fingers and Arlechino dissolves like ink on paper.
Dejé que esta historia llegara hasta aquí porque me gustan los finales distintos.=I let this story get this far because I like different endings.
Salgan, personajes olvidados. Es hora de otro capítulo.=Come out, forgotten characters. It is time for another chapter.
Interesante... pero yo escribo las historias.=Interesting... but I write the stories.
Ya no habrá más páginas. ¡Yo soy la historia!=There will be no more pages. I am the story!
Arlechino cae. El telón se rasga y la verdad se derrama sobre Aletia.=Arlechino falls. The curtain tears and the truth spills over Aletia.
Nadie perdonó a sus sirvientes, y la verdad llegó sola, fría y sin consuelo.=No one spared his servants, and the truth arrived alone, cold and without comfort.
FIN: La verdad sin piedad.=THE END: Truth without mercy.
Kian cierra su libro por última vez. Los sirvientes perdonados se despiden con una reverencia.=Kian closes his book one last time. The spared servants bow in farewell.
Por primera vez, Aletia escribe su propia historia.=For the first time, Aletia writes its own story.
FIN: La historia compartida.=THE END: The shared story.

d=Math.round(d*100/(100+DEF()*4))-Math.floor(DEF()/3);if(P.def)d=Math.ceil(d/2);if(P.wd>0){d=Math.ceil(d/2);P.wd--}d=Math.max(1,d);
if(P.sh>0){const a=Math.min(P.sh,d);P.sh-=a;d-=a}snd("hit");P.hp-=d;say(F.n+(k?" usa "+ESK[k]:" te ataca")+": "+d+" de daño.");hitId="hf";
if(k=="pois"){P.pz=3;P.pzd=Math.round(2+F.atk*.12);say("¡Estás envenenado! ("+P.pzd+" de daño por turno)")}
if(k=="drain")F.hp=Math.min(F.max,F.hp+Math.floor(d/2));
if(k=="fire"||k=="inferno"){P.bn={t:3,d:Math.max(2,Math.round(F.atk*.2))};say("¡Estás ardiendo!")}
if(P.hp<=0)return die();
if(k=="stun"){say("¡Quedas paralizado y pierdes el turno!");draw();setTimeout(foe,900);return}
end()}
function die(){snd("lose");saveRec(P.f);P.hp=0;over=true;say("Has caído en el combate "+(P.f+1)+".");draw()}
function win(){
if(F.fin){finNext();return}
const n=P.f+1,k=F.k;P.f=n;saveRec(n);say("¡Derrotas a "+F.n+"!");
const g=Math.round({n:R(12,22),e:R(35,50),b:R(90,110)}[k]*(1+n*.1)*P.gm);P.gold+=g;
if(n>=40){snd("win");over=true;say("¡Victoria! Has vencido a "+F.n+" y terminado la senda. Oro final: "+P.gold+".");return draw()}
P.lvl++;P.pts+=3;P.sp+=n>=20?2:1;derive();P.hp=Math.min(P.max,P.hp+Math.ceil(P.max*.25));P.mp=Math.min(P.mmax,P.mp+Math.ceil(P.mmax*.4));
let t="+"+g+" de oro. Nivel "+P.lvl+" (+3 puntos y +"+(n>=20?2:1)+" de habilidad). ";

if(k!="n"||Math.random()<.3){const w=drop(k=="n"?0:1);P.inv.push(w);t+="Botín: "+w[0]+" (para "+CL[cls(w)].n+"). "}
if(k=="b"){P.ws+=2;t+="Un jefe suelta 2 piedras de afilar. "}else if(Math.random()<.25){P.ws++;t+="Encuentras una piedra de afilar."}
MSG=t+(k=="b"?" ¡Elige una reliquia!":"");if(k=="b"){bossEnd(n);return}opts();go("map")}
draw();
</script>
