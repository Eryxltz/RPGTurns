<script>

// Si la conexión se cae, los jugadores reintentan solos; el anfitrión puede volver a ocupar la sala.
(function(){
if(window.claude&&window.claude.use)return;
function join(name,opts){return new Promise((res,rej)=>{
if(typeof Peer=="undefined")return rej({code:"upstream_error",message:"PeerJS no cargó"});
const hid="senda-"+name,H={},conns={},pres={},wantHub=!!(opts&&opts.host);let me=null,hub=false,conn=null,ready=false,pr={},src=[],list=[],ph=[],pk=null,done=false,left=false,retrying=false,tries=0;
const tm=setTimeout(()=>{if(!done){done=true;rej({code:"upstream_error",message:"Sin respuesta"})}},wantHub?32000:14000);
const fin=()=>{if(!done){done=true;clearTimeout(tm);res(R)}};
const fail=e=>{if(!done){done=true;clearTimeout(tm);rej(e)}};
const note=()=>setTimeout(()=>ph.forEach(f=>f({peers:list,joined:[],left:[],updated:[]})),0);
const mk=()=>{let s=src.slice();if(!s.some(x=>x[0]==me))s.push([me,pr]);list=s.map(([id,p])=>({peer:id,isMe:id==me,sameTab:id==me,kind:"viewer",guest:false,presence:id==me?pr:p,updatedAt:Date.now()}));note()};
const disp=m=>setTimeout(()=>(H[m.topic]||[]).forEach(f=>f({peer:m.from,isMe:m.from==me,sameTab:m.from==me,kind:"viewer",guest:false,topic:m.topic,data:m.data})),0);
const fan=m=>{Object.values(conns).forEach(c=>{try{c.send(m)}catch(e){}});disp(m)};
const push=()=>{src=Object.entries(pres);Object.values(conns).forEach(c=>{try{c.send({t:"l",l:src})}catch(e){}});mk()};
const clean=o=>{Object.keys(o).forEach(k=>o[k]===null&&delete o[k]);return o};
const retry=()=>{if(left||hub||retrying)return;retrying=true;setTimeout(()=>{retrying=false;link()},2500)};
const R={name,
emit(t,d){const m={t:"e",from:me,topic:t,data:d===undefined?null:JSON.parse(JSON.stringify(d))};if(hub)fan(m);else if(conn&&conn.open)conn.send(m);return Promise.resolve()},
on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=(H[t]||[]).filter(x=>x!==f)}},
presence(p){p=JSON.parse(JSON.stringify(p));clean(Object.assign(pr,p));if(hub){pres[me]=pr;push()}else{if(conn&&conn.open)conn.send({t:"p",patch:p});mk()}return Promise.resolve()},
peers(){return list},onPeers(f){ph.push(f);return()=>{ph=ph.filter(x=>x!==f)}},connected(){return ready},onConnection(){return()=>{}},
leave(){left=true;try{pk&&pk.destroy()}catch(e){}return Promise.resolve()}};
function link(){if(left||hub)return;
const go=()=>{conn=pk.connect(hid,{reliable:true});
conn.on("open",()=>{ready=true;try{conn.send({t:"p",patch:pr})}catch(e){}mk();fin()});
conn.on("data",d=>{if(!d)return;if(d.t=="e")disp(d);if(d.t=="l"){src=d.l;mk()}});
conn.on("close",()=>{ready=false;retry()});
conn.on("error",()=>{ready=false;retry()})};
if(pk&&!pk.destroyed&&!pk.disconnected&&me&&!hub){go();return}
try{pk&&pk.destroy()}catch(e){}
pk=new Peer();
pk.on("open",id=>{me=id;go()});
pk.on("error",e=>{if(!done&&!(e&&e.type=="peer-unavailable"))return fail(e);retry()})}
function startHub(){pk=new Peer(hid);
pk.on("open",id=>{me=id;hub=true;ready=true;pres[me]=pr;src=Object.entries(pres);mk();fin()});
pk.on("connection",c=>{c.on("open",()=>{conns[c.peer]=c;pres[c.peer]={};push()});
c.on("data",d=>{if(!d)return;if(d.t=="e")fan({t:"e",from:c.peer,topic:d.topic,data:d.data});if(d.t=="p"){pres[c.peer]=clean(Object.assign(pres[c.peer]||{},d.patch));push()}});
c.on("close",()=>{delete conns[c.peer];delete pres[c.peer];push()})});
pk.on("error",e=>{if(hub)return;if(e&&e.type=="unavailable-id"){if(wantHub&&tries++<10){try{pk.destroy()}catch(x){}setTimeout(startHub,2500)}else link()}else fail(e)})}
startHub();
})}
window.claude={use:async n=>n=="room"?{join,shim:true}:null};
})();
</script>

function bc(){M.rm.emit("st",M.G);sv()}

if(G.ph=="node"&&ps.length&&ps.every(z=>z.presence.rd))hGo();

if(G.ph=="play"){if(ps.length&&ps.every(z=>z.presence.dn)){G.ph="end";G.w=0;G.cur=null;lgp("El grupo ha caído.");return bc()}
const x=G.q&&G.q[G.ti];if(G.cur&&x&&x.k=="p"&&!ps.some(z=>z.peer==G.cur&&!z.presence.dn)){clearTimeout(M.to);hNext()}}
if(G.ph=="shop"&&G.cur&&!ps.some(z=>z.peer==G.cur))hShopNext()}
function hStart(){if(M.G.ph!="lobby")return;hSpawn()}
function hGo(){if(M.G.ph=="node")hSpawn()}
function hSpawn(){const G=M.G,N=Math.max(1,roster().length),n=G.f+1,r=Math.random(),k=n%10==0?"b":r<.18?"e":r<.48?"h":"n";G.N=N;
const Z=EN[Math.min(3,Math.floor((n-1)/10))],sh=(1+.17*(n-1))*(1+.65*(N-1)),sa=(1+.07*(n-1))*(1+.12*(N-1));
const list=k=="b"?[Z.b[0]]:k=="e"?[pk(Z.e)]:Array.from({length:k=="h"?Math.min(4,2+(N>1?1:0)+(N>2&&Math.random()<.5?1:0)):(N>2?2:1)},()=>pk(Z.n));
const hz=k=="h"?.7:(list.length>1?.8:1),tot={},seen={};list.forEach(b=>tot[b[0]]=(tot[b[0]]||0)+1);
G.en=list.map(b=>{seen[b[0]]=(seen[b[0]]||0)+1;const h=Math.round(b[2]*sh*hz),k2=b[6];return{n:b[0]+(tot[b[0]]>1?" "+"ABCD"[seen[b[0]]-1]:""),e:b[1],hp:h,max:h,atk:Math.round(b[3]*sa),sp:Math.max(1,Math.round(((k2.includes("multi")?7:5)+(k2.includes("heavy")?-2:0)+(k2.includes("rage")?1:0)+R(0,3))*(1+.05*(n-1)))),w:b[4],r:b[5],sk:k2,pois:0,pd:5,stun:0,g:0}});
G.k=k;G.n=n;G.g=Math.round(list.length*({b:100,e:42,h:17,n:17}[k])*(1+n*.1)*(.9+Math.random()*.2));
G.lg=[(k=="b"?"¡Jefe! ":k=="e"?"¡Élite! ":k=="h"?"¡Horda! ":"")+G.en.map(e=>e.n).join(", ")+(N>1?" ("+N+" jugadores)":"")];G.rd=0;hRound()}
// orden de turnos por velocidad
function hRound(){const G=M.G;G.rd++;G.ph="play";const q=[];
roster().forEach(p=>{if(!p.presence.dn)q.push({k:"p",i:p.peer,s:(p.presence.sp||1)+Math.random()*.9,e:CL[p.presence.c].e,n:p.presence.nm})});
G.en.forEach((e,i)=>{if(e.hp>0)q.push({k:"e",i,s:e.sp+Math.random()*.9,e:e.e,n:e.n})});
q.sort((a,b)=>b.s-a.s);G.q=q.map(x=>({k:x.k,i:x.i,e:x.e,n:x.n,s:Math.floor(x.s)}));G.ti=-1;hNext()}
function hNext(){const G=M.G;clearTimeout(M.to);if(G.ph!="play")return;
if(G.en.every(e=>e.hp<=0))return hWin();
const ps=roster();if(!ps.length||ps.every(q=>q.presence.dn)){G.ph="end";G.w=0;G.cur=null;lgp("El grupo ha caído.");return bc()}
G.ti++;if(G.ti>=G.q.length)return hRound();
const x=G.q[G.ti];
if(x.k=="e"){const e=G.en[x.i];if(!e||e.hp<=0)return hNext();G.cur=null;G.cn=e.n;bc();setTimeout(()=>{if(M&&M.host&&M.G===G&&G.ph=="play")hEnemy(e)},900);return}
const q=ps.find(p=>p.peer==x.i);if(!q||q.presence.dn)return hNext();
G.cur=x.i;G.cn=q.presence.nm;bc();M.to=setTimeout(()=>{if(M.G===G&&G.ph=="play"&&G.cur==x.i){lgp(G.cn+" pierde el turno.");hNext()}},45000)}
function applyFx(fx){const G=M.G;(fx||[]).forEach(x=>{const e=G.en[x.t];if(!e||e.hp<=0)return;e.hp-=Math.min(99999,Math.max(0,+x.d||0));if(x.st)e.stun=1;if(x.pz){e.pois=3;e.pd=Math.min(999,+x.pd||5)}})}
function hFx(m){const G=M.G;if(G.ph=="play"&&m.data)applyFx(m.data.fx)}
function hAct(m){const G=M.G,a=m.data;if(G.ph!="play"||!a||G.cur!=sid(m))return;clearTimeout(M.to);applyFx(a.fx);if(a.lg)lgp(String(a.lg).slice(0,90));G.cur=null;bc();setTimeout(()=>{if(M&&M.G===G&&G.ph=="play")hNext()},900)}
function hEnemy(e){const G=M.G,nx=t=>setTimeout(()=>{if(M&&M.host&&M.G===G&&G.ph=="play")hNext()},t);
if(e.pois>0){e.pois--;e.hp-=e.pd;lgp(e.n+" sufre veneno ("+e.pd+").");if(e.hp<=0){lgp(e.n+" cae.");bc();return nx(800)}}
if(e.g>0)e.g--;
if(e.stun){e.stun=0;lgp(e.n+" está aturdido.");bc();return nx(800)}
const al=alive();if(!al.length)return hNext();
const t=pk(al),k=e.sk.length&&Math.random()<.35+Math.min(.3,G.n*.006)?pk(e.sk):"";
if(k=="heal"){const h=Math.round(e.max*.2);e.hp=Math.min(e.max,e.hp+h);lgp(e.n+" usa "+ESK[k]+".");bc();return nx(900)}
if(k=="rage"){e.atk=Math.round(e.atk*1.25);lgp(e.n+" usa "+ESK[k]+".");bc();return nx(900)}
if(k=="guard"){e.g=2;lgp(e.n+" adopta una postura defensiva.");bc();return nx(900)}
let raw=e.atk+R(-2,3);if(k=="heavy")raw=Math.round(raw*1.8);if(k=="multi")raw=Math.round(raw*1.4);
if(k=="drain")e.hp=Math.min(e.max,e.hp+Math.floor(raw*.4));
lgp(e.n+(k?" usa "+ESK[k]:" ataca")+" a "+t.presence.nm+".");bc();M.rm.emit("eh",{to:t.peer,raw,k,pd:Math.round(2+e.atk*.12)});nx(1400)}
function hWin(){const G=M.G;clearTimeout(M.to);G.f=G.n;G.cur=null;lgp("¡Combate "+G.n+" superado!");
if(G.n>=40){G.ph="end";G.w=1;return bc()}
G.ph="vote";G.op=Object.keys(ND).filter(k=>k!="bat"&&k!="eli").sort(()=>Math.random()-.5).slice(0,3);bc();
clearTimeout(M.vt);M.vt=setTimeout(()=>{if(M.G===G&&G.ph=="vote")hDecide()},60000)}
// votación del camino (empate: decide el anfitrión)
function hVote(){const G=M.G,ps=roster();if(G.ph=="vote"&&ps.length&&ps.every(q=>vk(q)>=0))hDecide()}
function hDecide(){const G=M.G;clearTimeout(M.vt);const c=[0,0,0];let hv=-1;

const mx=Math.max(...c),tie=[0,1,2].filter(i=>c[i]==mx),w=mx==0?R(0,2):tie.length>1?(tie.includes(hv)?hv:tie[0]):tie[0];
G.nd=G.op[w];lgp("Eligen: "+ND[G.nd][1]+".");if(G.nd=="mer")return hShopStart();G.ph="node";bc()}
// tienda compartida por turnos
function hShopStart(){const G=M.G,ps=roster(),it=[];
const ks=Object.keys(CL);for(let z=0;z<Math.max(4,ps.length+2);z++){const c=pk(ks),w=Math.random()<.5?gw(c,Math.min(8,1+Math.floor(G.f/5)+(Math.random()<.2?1:0))):ga(c,Math.min(11,Math.floor(G.f/3.4)+(Math.random()<.2?1:0)));it.push({w,pr:Math.round(val(w)*2.3)+8})}
it.push({s:1,pr:30,t:"🪨 Piedra de afilar"});const a=R(0,5);it.push({a,pr:45,t:"Amuleto: +1 "+SN[a]});
G.sh={hp:R(2,5),mp:R(2,5),it,o:ps.slice().sort((x,y)=>(y.presence.sp||0)-(x.presence.sp||0)).map(q=>q.peer),ti:0};
G.ph="shop";G.cur=G.sh.o[0];bc();M.to=setTimeout(()=>{if(M.G===G&&G.ph=="shop"&&G.cur==G.sh.o[0])hShopNext()},60000)}
function hBuy(m){const G=M.G,s=G.sh,d=m.data;if(G.ph!="shop"||!s||!d||sid(m)!=G.cur)return;
if(d.k=="h"){if(s.hp>0)s.hp--}else if(d.k=="m"){if(s.mp>0)s.mp--}else{const i=+d.k;if(s.it[i])s.it.splice(i,1)}bc()}

function hShopNext(){const G=M.G,s=G.sh,ps=roster();clearTimeout(M.to);let i=s.ti+1;while(i<s.o.length&&!ps.some(q=>q.peer==s.o[i]))i++;
if(i>=s.o.length){G.ph="node";G.cur=null;return bc()}
s.ti=i;G.cur=s.o[i];bc();M.to=setTimeout(()=>{if(M.G===G&&G.ph=="shop"&&G.cur==s.o[i])hShopNext()},60000)}
// cliente
function onSt(d){if(!d||!M)return;if(M.late)return;
if(!M.first){M.first=1;if(!M.host){if(M.resume&&M.rid&&d.rid==M.rid)mCatch(d);else if(d.ph!="lobby"){M.late=1;M.rm.presence({c:null});MSG="La partida ya empezó. Pide al anfitrión una sala nueva.";go("mnone");return}}}
if(d.rid&&!M.rid)M.rid=d.rid;
if(!M.host)M.G=d;
if(d.ph=="play"){if(d.n!=M.fn){M.fn=d.n;M.tk="";M.tg=0;P.def=false;P.wd=0;P.sm=null;P.buff=false;P.pz=0;P.skip=0;M.rd=false;go("mfight")}
const tk=d.rd+":"+d.ti;if(tk!=M.tk){M.tk=tk;onTurn(d)}}
if(d.ph=="vote"&&d.f>P.f)mWon(d);
else if(d.ph=="shop"&&M.sk!=d.f){M.sk=d.f;go("mshop")}
else if(d.ph=="node"&&M.nk!=d.f){M.nk=d.f;mNode(d)}
if(d.ph=="end"&&scr!="mend"){snd(d.w?"win":"lose");go("mend");return}
if(["lobby","mwait","mfight","mend","mvote","mshop"].includes(scr))draw()}
function onTurn(d){if(d.cur==M.me&&!P.down){M.busy=false;P.def=false;snd("turn");
if(P.pz>0){P.pz--;P.hp-=P.pzd;P.S.t+=P.pzd;if(P.hp<=0){P.hp=0;P.down=true;M.busy=true;upP();M.rm.emit("act",{fx:[],lg:M.name+" cae envenenado."});draw();return}}
if(P.sm){const i=d.en.findIndex(e=>e.hp>0),x=Math.max(1,Math.round(P.sm.d));if(i>=0){M.rm.emit("fx",{fx:[{t:i,d:x}]});P.S.d+=x}if(--P.sm.t<=0)P.sm=null}
if(P.skip){P.skip=0;M.busy=true;M.rm.emit("act",{fx:[],lg:M.name+" está paralizado."})}
upP()}
if(scr=="mfight")draw()}
function mNode(d){if(d.nd=="mer"){mReady();return}if(d.nd=="for"){MSG="";go("forge");return}node(d.nd)}
function mvote(i){if(!M.G||M.G.ph!="vote")return;M.v=M.G.f*10+i;upP();draw()}
function tgi(){const en=M.G.en;if(en[M.tg]&&en[M.tg].hp>0)return M.tg;const i=en.findIndex(e=>e.hp>0);return i<0?0:i}
function onEh(d){if(!d||!M||d.to!=M.me||P.down)return;
if(Math.random()<P.st[2]*.008){snd("def");return}
let x=Math.round((+d.raw||1)*100/(100+DEF()*4))-Math.floor(DEF()/3);if(P.def)x=Math.ceil(x/2);if(P.wd>0){x=Math.ceil(x/2);P.wd--}x=Math.max(1,x);
P.hp-=x;P.S.t+=x;snd("hit");
if(d.k=="pois"){P.pz=3;P.pzd=Math.min(999,+d.pd||3)}
if(d.k=="stun")P.skip=1;
if(P.hp<=0){P.hp=0;P.down=true;snd("lose")}
upP();draw()}
function mAct(k){const G=M.G;if(M.busy||P.down||G.ph!="play"||G.cur!=M.me)return;
if(k=="r"&&P.mp<8)return;
const t=tgi(),T=G.en[t],fx=[],C=CL[P.c];let lg="";F=T;
M.busy=true;snd(sfx(k));
if(k=="a"){const[d,c]=hit(1,P.w[2],0,P.w[5],1);fx.push({t,d});P.mp=Math.min(P.mmax,P.mp+1);P.S.d+=d;lg=M.name+" ataca a "+T.n+": "+d+(c?" ¡crítico!":"")+HN}
else if(k=="d"){P.def=true;P.mp=Math.min(P.mmax,P.mp+3);lg=M.name+" se defiende."}
else if(k=="p"){P.pot--;const h=Math.min(Math.ceil(P.max*.4),P.max-P.hp);P.hp+=h;P.S.h+=h;lg=M.name+" bebe una poción."}
else if(k=="q"){P.mpot--;P.mp=Math.min(P.mmax,P.mp+Math.ceil(P.mmax*.4));lg=M.name+" bebe una poción de maná."}
else if(k=="r"){const z=roster().find(q=>q.presence.dn);P.mp-=8;P.S.m+=8;if(z){M.rm.emit("rv",{to:z.peer});P.S.r++;lg=M.name+" revive a "+z.presence.nm+"."}}
else{const s=C.sk[k];P.mp-=s.c;P.S.m+=s.c;if(s.h)P.hp-=s.h;
if(s.k=="dmg"||s.k=="stun"||s.k=="drain"){const[d,c]=hit(s.m,s.t,s.cb,s.e);fx.push({t,d,st:s.k=="stun"?1:0});P.S.d+=d;lg=M.name+": "+s.n+" a "+T.n+" ("+d+(c?" ¡crítico!":"")+")"+HN;if(s.k=="drain"){const h=Math.min(Math.floor(d/2),P.max-P.hp);P.hp+=h;P.S.h+=h}}
if(s.k=="summon"){P.sm={n:s.n,d:s.b+P.st[1]*s.mm,t:s.tt,e:s.e};lg=M.name+" invoca a "+s.n+"."}
if(s.k=="buff"){P.buff=true;lg=M.name+" se enfurece."}
if(s.k=="ward"){P.wd=2;lg=M.name+" levanta un escudo."}
if(s.k=="pois"){fx.push({t,pz:1,pd:4+P.lvl});lg=M.name+" envenena a "+T.n+"."}
if(s.k=="heal"){const h=P.st[1]*s.m+12,z=roster().filter(q=>!q.presence.dn).sort((a,b)=>a.presence.hp/a.presence.mx-b.presence.hp/b.presence.mx)[0];
if(z&&z.peer!=M.me){M.rm.emit("hl",{to:z.peer,h});P.S.h+=h;lg=M.name+" cura a "+z.presence.nm+" (+"+h+")."}else{const a=Math.min(h,P.max-P.hp);P.hp+=a;P.S.h+=a;lg=M.name+" se cura (+"+a+")."}}}
M.rm.emit("act",{fx,lg});upP();draw()}
function mReady(){M.rd=true;upP();go("mwait")}
function mWon(d){const k=d.k;P.f=d.f;P.down=false;M.rd=false;M.v=-1;snd("win");
P.lvl++;P.pts+=3;P.sp++;derive();P.hp=Math.min(P.max,Math.max(P.hp,Math.ceil(P.max*.25))+Math.ceil(P.max*.25));P.mp=Math.min(P.mmax,P.mp+Math.ceil(P.mmax*.4));
const g=Math.round(d.g/Math.max(1,d.N)*P.gm);P.gold+=g;let t="Tu parte del botín: +"+g+" de oro. Nivel "+P.lvl+" (+3 puntos y +1 de habilidad). ";
if(k!="n"||Math.random()<.5){const w=drop(k=="n"?0:1);P.inv.push(w);t+="Objeto: "+w[0]+" (para "+CL[cls(w)].n+"). "}
if(k=="b"){P.ws+=2;t+="+2 piedras de afilar. "}else if(Math.random()<.25){P.ws++;t+="+1 piedra de afilar."}
MSG=t;upP();if(k=="b"){rl();return}go("mvote")}
function mbuy(k){const G=M.G,s=G.sh;if(G.ph!="shop"||G.cur!=M.me||!s||Date.now()-(M.bl||0)<500)return;

P.eq.map(i=>{const x=C.sk[i];return '<button '+(d||P.mp<x.c||(x.h&&P.hp<=x.h)?'disabled':'')+' onclick="mAct('+i+')">'+x.n+'<small>'+(x.h?x.h+' de vida':x.c+' de maná')+' '+EI[x.e]+'</small></button>'}).join('')+
'<button '+(d?'disabled':'')+' onclick="mAct(\'d\')">Defender<small>+3 de maná</small></button>'+
'<button '+(d||P.pot<1?'disabled':'')+' onclick="mAct(\'p\')">Poción de vida<small>quedan '+P.pot+'</small></button>'+
'<button '+(d||P.mpot<1?'disabled':'')+' onclick="mAct(\'q\')">Poción de maná<small>quedan '+P.mpot+'</small></button>'+
(dn?'<button '+(d||P.mp<8?'disabled':'')+' onclick="mAct(\'r\')">Revivir aliado<small>8 de maná</small></button>':'')+
'<button onclick="ret=\'mfight\';go(\'inv\')">Personaje'+(P.pts||P.sp?' ('+(P.pts+P.sp)+')':'')+'</button></div>';
const l=$("log");if(l)l.scrollTop=1e5;return}
const C=CL[P.c],d=busy||over,tg=F.k=="e"?" · Élite":F.k=="b"?" · Jefe":"";
A.innerHTML=hd("Combate")+
'<div class="card row"><div id="ef">'+fa(F.e,64)+'</div><div class="grow"><div class="name"><span>'+F.n+tg+(F.pois>0?' ☠️':'')+(F.stun?' ❄️':'')+'</span><span class="num">'+Math.max(0,F.hp)+'/'+F.max+'</span></div>'+bar("hp",F.hp,F.max)+'<div class="num">Débil: '+EI[F.w]+' · Resiste: '+EI[F.r]+(P.sm?' · '+P.sm.n+' ('+P.sm.t+')':'')+'</div><div class="num">'+F.sk.map(x=>ESK[x]).join(' · ')+'</div></div></div>'+
'<div class="card" id="log" aria-live="polite">'+LOG.map(t=>'<p>'+t+'</p>').join('')+'</div>'+
'<div class="card row"><div id="hf">'+fa(C.e,64)+'</div><div class="grow"><div class="name"><span>'+C.n+(P.pz>0?' ☠️':'')+'</span><span class="num">'+P.w[0]+' +'+P.w[1]+'</span></div>'+bar("hp",P.hp,P.max)+'<div class="num">Vida '+P.hp+'/'+P.max+'</div>'+bar("mp",P.mp,P.mmax)+'<div class="num">Maná '+P.mp+'/'+P.mmax+'</div>'+stl(P.st)+'</div></div>'+
(over?'<div class="acts"><button onclick="go(\'pick\')">Jugar otra vez</button><button onclick="go(\'menu\')">Menú</button></div>':
'<div class="acts"><button '+(d?'disabled':'')+' onclick="act(\'a\')">Atacar<small>+1 de maná</small></button>'+
P.eq.map(i=>{const x=C.sk[i];return '<button '+(d||P.mp<x.c||(x.h&&P.hp<=x.h)?'disabled':'')+' onclick="act('+i+')">'+x.n+'<small>'+(x.h?x.h+' de vida':x.c+' de maná')+' '+EI[x.e]+'</small></button>'}).join('')+
'<button '+(d?'disabled':'')+' onclick="act(\'d\')">Defender<small>+3 de maná</small></button>'+
'<button '+(d||P.pot<1?'disabled':'')+' onclick="act(\'p\')">Poción de vida<small>quedan '+P.pot+'</small></button>'+
'<button '+(d||P.mpot<1?'disabled':'')+' onclick="act(\'q\')">Poción de maná<small>quedan '+P.mpot+'</small></button>'+
'<button '+(d?'disabled':'')+' onclick="ret=\'fight\';go(\'inv\')">Personaje'+(P.pts||P.sp?' ('+(P.pts+P.sp)+')':'')+'</button></div>');
const l=$("log");if(l)l.scrollTop=1e5;
if(hitId){const e=$(hitId);e&&e.classList.add("hit");hitId=null}}
function pickC(k){tmp=k;TW=[gw(k,0,0),gw(k,0,1)];go("weapon")}
function pickW(i){const C=CL[tmp];P={c:tmp,st:[...C.st],lvl:1,pot:2,mpot:1,gold:30,ws:0,pts:0,f:0,w:TW[i],inv:[],def:false,buff:false,wd:0,pz:0,sm:null,sp:1,kn:[true],eq:[0],ar:ga(tmp,0),S:{d:0,t:0,h:0,g:0,m:0,r:0},down:false,xh:0,xm:0,dm:0,gm:1,ls:0};derive();P.hp=P.max;P.mp=P.mmax;over=false;MSG="";rl()}
function rl(){RP=RL.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,3);go("relic")}
function relic(i){const m=P.max,mm=P.mmax;RL[RP[i]][2](P);derive();P.hp+=P.max-m;P.mp+=P.mmax-mm;if(P.f==0){M?mJoin():fight("n")}else{if(M)go("mvote");else{opts();go("map")}}}
function learn(i){const s=CL[P.c].sk[i];if(P.kn[i]||P.sp<s.p||(i>1&&!P.kn[i-2]))return;P.sp-=s.p;P.kn[i]=true;if(P.eq.length<4)P.eq.push(i);draw()}
function add(i){if(P.pts<1)return;P.pts--;bump(i);draw()}
function eq(i){const x=P.inv[i];if(!can(x))return;const m=P.max;if(isA(x)){P.inv[i]=P.ar;P.ar=x}else{P.inv[i]=P.w;P.w=x}derive();P.hp=Math.max(1,Math.min(P.max,P.hp+P.max-m));SEL=null;draw()}
function buy(k){if(k=="h"){if(ST.hp&&P.gold>=10+P.f*2){ST.hp--;P.gold-=10+P.f*2;P.S.g+=10+P.f*2;P.pot++}}else if(k=="m"){if(ST.mp&&P.gold>=8+P.f*2){ST.mp--;P.gold-=8+P.f*2;P.S.g+=8+P.f*2;P.mpot++}}else{const x=ST.it[k];if(P.gold>=x.pr){P.gold-=x.pr;P.S.g+=x.pr;if(x.w)P.inv.push(x.w);else if(x.s)P.ws++;else bump(x.a);ST.it.splice(k,1)}}draw()}
function sell(i){P.gold+=val(P.inv[i]);P.inv.splice(i,1);SEL=null;draw()}
function forge(){const u=P.w[6]||0;P.gold-=(u+1)*(25+P.f*2);P.S.g+=(u+1)*(25+P.f*2);P.ws-=u+1;P.w[1]+=2;P.w[6]=u+1;draw()}
function item(){const r=Math.random();if(r<.5){const w=drop(0,1);return{w,pr:Math.round(val(w)*2.3)+8}}if(r<.75)return{s:1,pr:30,t:"🪨 Piedra de afilar"};const i=R(0,5);return{a:i,pr:45,t:"Amuleto: +1 "+SN[i]}}
function node(k){
if(k=="bat"||k=="eli")return fight(k=="bat"?"n":"e");
if(k=="mer"){SEL=null;ST={hp:R(1,4),mp:R(1,4),it:[item(),item(),item()]};return go("shop")}
if(k=="for")return go("forge");
if(k=="rep"){P.hp=Math.min(P.max,P.hp+Math.ceil(P.max*.5));P.mp=P.mmax;MSG="Descansas junto al fuego: recuperas vida y todo el maná."}
if(k=="rec"){const g=Math.round(R(25,45)*(1+P.f*.1)*P.gm);P.gold+=g;if(Math.random()<.5){const w=drop(1);P.inv.push(w);MSG="Encuentras "+g+" de oro y "+w[0]+" (para "+CL[cls(w)].n+")."}else{P.ws+=2;MSG="Encuentras "+g+" de oro y 2 piedras de afilar."}}
if(k=="ent"){P.pts+=2;MSG="Entrenas duro: +2 puntos de estadística."}
if(k=="alt"){P.hp=Math.max(1,P.hp-12);P.pts+=4;MSG="El altar toma 12 de vida y te concede 4 puntos de estadística."}
go("msg")}
function fight(k){const n=P.f+1;if(n%10==0)k="b";const Z=EN[Math.min(3,Math.floor((n-1)/10))],b=k=="b"?Z.b[0]:pk(Z[k]),sh=1+.17*(n-1),sa=1+.07*(n-1);
F={n:b[0],e:b[1],hp:Math.round(b[2]*sh),atk:Math.round(b[3]*sa),w:b[4],r:b[5],sk:b[6],pois:0,stun:0,g:0,k};F.max=F.hp;P.sm=null;P.pz=0;P.def=false;busy=false;LOG=[];say("Aparece "+F.n+(k=="e"?" (élite)":k=="b"?" (jefe)":"")+".");go("fight")}
function em(el,wel,bs){let m=1;if(!bs){if(el==wel)m=1.3;else if(OPP[el]==wel)m=.7}if(F.w==el)m*=1.5;if(F.r==el)m*=.5;return m}
function hit(m,t,cb,el,bs){const x=em(el,P.w[5],bs);HN=F.w==el?" ¡Punto débil!":F.r==el?" (resiste)":x>1?" (afinidad)":x<1?" (arma opuesta)":"";let b=(P.st[TI[t]]+P.w[1]+R(0,4))*m*x*(1+P.dm)*(F.g>0?.5:1);if(P.buff){b*=2;P.buff=false}
const c=Math.random()<.03+P.st[2]*.01+P.st[5]*.015+(cb||0);if(c)b*=1.8;b=Math.round(b);P.hp=Math.min(P.max,P.hp+Math.floor(b*P.ls));return[b,c]}
function act(k){if(!busy&&!over)snd(sfx(k));
if(busy||over)return;busy=true;P.def=false;hitId="ef";
if(k=="a"){const[d,c]=hit(1,P.w[2],0,P.w[5],1);F.hp-=d;P.mp=Math.min(P.mmax,P.mp+1);say((c?"¡Crítico! ":"")+"Atacas y causas "+d+" de daño."+HN)}
else if(k=="d"){P.def=true;P.mp=Math.min(P.mmax,P.mp+3);hitId=null;say("Te cubres y recuperas 3 de maná.")}
else if(k=="p"){P.pot--;const h=Math.min(Math.ceil(P.max*.4),P.max-P.hp);P.hp+=h;hitId=null;say("Bebes una poción: +"+h+" de vida.")}
else if(k=="q"){P.mpot--;const h=Math.min(Math.ceil(P.mmax*.4),P.mmax-P.mp);P.mp+=h;hitId=null;say("Bebes una poción de maná: +"+h+".")}
else{const s=CL[P.c].sk[k];P.mp-=s.c;if(s.h)P.hp-=s.h;
if(s.k=="dmg"||s.k=="stun"||s.k=="drain"){const[d,c]=hit(s.m,s.t,s.cb,s.e);F.hp-=d;say(s.n+(c?" (¡crítico!)":"")+": "+d+" de daño."+HN+(s.k=="stun"?" Aturdido.":""));
if(s.k=="stun")F.stun=1;if(s.k=="drain"){const h=Math.min(Math.floor(d/2),P.max-P.hp);P.hp+=h;say("Robas "+h+" de vida.")}}
if(s.k=="summon"){P.sm={n:s.n,d:Math.round(s.b+P.st[1]*s.mm),t:s.tt,e:s.e};hitId=null;say("Invocas a "+s.n+" durante "+s.tt+" turnos.")}
if(s.k=="buff"){P.buff=true;hitId=null;say("Tu próximo ataque hará el doble de daño.")}
if(s.k=="pois"){F.pois=3;F.pd=4+P.lvl;say("Envenenas a "+F.n+": "+F.pd+" de daño por turno durante 3 turnos.")}
if(s.k=="ward"){P.wd=2;hitId=null;say("Un escudo divino reduce a la mitad el daño durante 2 turnos.")}
if(s.k=="heal"){const h=Math.min(P.st[1]*s.m+12,P.max-P.hp);P.hp+=h;hitId=null;say("Curas "+h+" de vida.")}}
draw();
if(F.hp<=0){setTimeout(win,700);return}
setTimeout(foe,800)}
function end(){busy=false;draw()}
function foe(){if(F.g>0)F.g--;
if(P.sm){const d=Math.max(1,Math.round(P.sm.d*em(P.sm.e,"",1)));F.hp-=d;say(P.sm.n+" ataca: "+d+" de daño.");if(--P.sm.t<=0){say(P.sm.n+" desaparece.");P.sm=null}if(F.hp<=0){draw();setTimeout(win,600);return}}
if(F.pois>0){F.pois--;F.hp-=F.pd;say("El veneno causa "+F.pd+" de daño.");if(F.hp<=0){draw();setTimeout(win,600);return}}
if(F.stun){F.stun=0;say(F.n+" está aturdido y pierde el turno.");return end()}
if(P.pz>0){P.pz--;P.hp-=P.pzd;say("El veneno te causa "+P.pzd+" de daño.");if(P.hp<=0)return die()}
if(Math.random()<P.st[2]*.008){say("¡Esquivas el ataque de "+F.n+"!");return end()}
const k=F.sk.length&&Math.random()<.35+Math.min(.3,(P.f+1)*.006)?pk(F.sk):"";
if(k=="heal"){const h=Math.round(F.max*.2);F.hp=Math.min(F.max,F.hp+h);say(F.n+" usa "+ESK[k]+": +"+h+" de vida.");return end()}
if(k=="rage"){F.atk=Math.round(F.atk*1.25);say(F.n+" usa "+ESK[k]+": su ataque aumenta.");return end()}
if(k=="guard"){F.g=2;say(F.n+" adopta una postura defensiva: recibe la mitad de daño.");return end()}
let d=F.atk+R(-2,3);if(k=="heavy")d=Math.round(d*1.8);if(k=="multi")d=Math.round(d*1.4);
d=Math.round(d*100/(100+DEF()*4))-Math.floor(DEF()/3);if(P.def)d=Math.ceil(d/2);if(P.wd>0){d=Math.ceil(d/2);P.wd--}d=Math.max(1,d);
snd("hit");P.hp-=d;say(F.n+(k?" usa "+ESK[k]:" te ataca")+": "+d+" de daño.");hitId="hf";
if(k=="pois"){P.pz=3;P.pzd=Math.round(2+F.atk*.12);say("¡Estás envenenado! ("+P.pzd+" de daño por turno)")}
if(k=="drain")F.hp=Math.min(F.max,F.hp+Math.floor(d/2));
if(P.hp<=0)return die();
if(k=="stun"){say("¡Quedas paralizado y pierdes el turno!");draw();setTimeout(foe,900);return}
end()}
function die(){snd("lose");saveRec(P.f);P.hp=0;over=true;say("Has caído en el combate "+(P.f+1)+".");draw()}
function win(){
const n=P.f+1,k=F.k;P.f=n;saveRec(n);say("¡Derrotas a "+F.n+"!");
const g=Math.round({n:R(12,22),e:R(35,50),b:R(90,110)}[k]*(1+n*.1)*P.gm);P.gold+=g;
if(n>=40){snd("win");over=true;say("¡Victoria! Has vencido a "+F.n+" y terminado la senda. Oro final: "+P.gold+".");return draw()}
P.lvl++;P.pts+=3;P.sp++;derive();P.hp=Math.min(P.max,P.hp+Math.ceil(P.max*.25));P.mp=Math.min(P.mmax,P.mp+Math.ceil(P.mmax*.4));
let t="+"+g+" de oro. Nivel "+P.lvl+" (+3 puntos y +1 de habilidad). ";

if(k!="n"||Math.random()<.3){const w=drop(k=="n"?0:1);P.inv.push(w);t+="Botín: "+w[0]+" (para "+CL[cls(w)].n+"). "}
if(k=="b"){P.ws+=2;t+="Un jefe suelta 2 piedras de afilar. "}else if(Math.random()<.25){P.ws++;t+="Encuentras una piedra de afilar."}
MSG=t+(k=="b"?" ¡Elige una reliquia!":"");if(k=="b"){rl();return}opts();go("map")}
draw();
</script>
